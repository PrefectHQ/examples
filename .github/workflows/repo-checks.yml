name: Repo checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Protected paths still exist
        run: uv run python -m internal.protected

      - name: Examples follow the contract and CATALOG.yaml is current
        run: uv run python -m internal.catalog --check

      - name: Internal tests
        run: uv run pytest -q internal/tests/test_catalog.py internal/tests/test_protected.py internal/tests/test_main.py
